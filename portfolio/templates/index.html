{% extends 'base.html' %}
{% block content %}

<!--Hero Section-->
<section class="hero">
    <h1>Asslam-u-alkium! My Name is Talha Fiaz</h1>
    <p>A Django Developer passionate about building cool stuff</p>
</section>
<!--Projects Grid-->
<div class="row">
    {% for project in projects %}
    <div class="col-md-4">
        <div class="card">
            <img src="{{project.image.url}}" alt="" class="card-img-top">
        </div>
        <div class="card-body">
            <h5>{{project.title}}</h5>
            <p>{{project.description}}</p>
            <a href="{{project.demo_url}}" class="btn btn-primary">Demo</a>
        </div>
    </div>
    {% endfor %}
</div>

{% endblock  %}
